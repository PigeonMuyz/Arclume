name: 错误报告
description: 报告 App、启动器、更新或迁移的可复现问题
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        请勿上传账号、密码、完整 Games 容器、游戏文件或未经脱敏的日志。安全问题请使用安全公告入口。
  - type: input
    id: version
    attributes:
      label: Arclume 版本与构建号
      placeholder: 例如 1.0.1 (3)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS 版本与芯片
      placeholder: 例如 macOS 26.0，Apple Silicon
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: 使用的运行模式
      options:
        - 原生 macOS
        - CrossOver
        - Arclume Wine Runtime
        - 不确定
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为与复现步骤
      description: 请从启动 App 开始按顺序说明，尽量提供最小复现。
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 脱敏后的日志、崩溃报告或截图
      description: 仅粘贴相关片段或附加脱敏文件；不要包含账号、绝对个人路径或游戏内容。
