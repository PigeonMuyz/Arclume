name: 构建并发布 macOS DMG

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release:
        description: "github actions，或与 App 版本一致的版本号，例如 1.0.1-3"
        required: true
        default: "github actions"
        type: string

permissions:
  contents: write

concurrency:
  group: arclume-release-resources
  cancel-in-progress: false

jobs:
  build-and-release:
    name: 构建 macOS DMG
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, 'release:')
    runs-on: macos-26
    env:
      PROJECT: Arclume.xcodeproj
      SCHEME: Arclume
      GH_TOKEN: ${{ github.token }}
      MACOS_APP_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_APP_CERTIFICATE_P12_BASE64 }}
      MACOS_APP_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_APP_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      MACOS_DEVELOPER_TEAM_ID: ${{ secrets.MACOS_DEVELOPER_TEAM_ID }}
      ARCLUME_RESOURCE_BASE_URL: ${{ secrets.ARCLUME_RESOURCE_BASE_URL }}

    steps:
      - name: 检出源代码和 LFS 资源
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: 确认构建环境
        run: |
          sw_vers
          xcodebuild -version
          git lfs version

      - name: 读取并校验发布版本
        id: release
        env:
          RELEASE_INPUT: ${{ inputs.release }}
        run: |
          set -euo pipefail

          if [ -z "$ARCLUME_RESOURCE_BASE_URL" ]; then
            echo "未配置 ARCLUME_RESOURCE_BASE_URL Secret，无法构建发布版本。" >&2
            exit 1
          fi

          build_settings=$(xcodebuild -showBuildSettings \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release -onlyUsePackageVersionsFromResolvedFile)
          version=$(printf '%s\n' "$build_settings" | awk -F ' = ' '/^[[:space:]]*MARKETING_VERSION = / { print $2; exit }')
          build=$(printf '%s\n' "$build_settings" | awk -F ' = ' '/^[[:space:]]*CURRENT_PROJECT_VERSION = / { print $2; exit }')
          test -n "$version"
          test -n "$build"

          expected_tag="v${version}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            directive="$RELEASE_INPUT"
          else
            directive=$(jq -r '.head_commit.message // empty' "$GITHUB_EVENT_PATH" | awk '
              match($0, /^[[:space:]]*release:[[:space:]]*/) {
                sub(/^[[:space:]]*release:[[:space:]]*/, "")
                print
                exit
              }
            ')
          fi
          directive=$(printf '%s' "$directive" | xargs)
          test -n "$directive"

          if [ "$(printf '%s' "$directive" | tr '[:upper:]' '[:lower:]')" = "github actions" ]; then
            tag="$expected_tag"
          else
            requested_tag="$directive"
            case "$requested_tag" in
              v*) ;;
              *) requested_tag="v${requested_tag}" ;;
            esac
            if [ "$requested_tag" != "$expected_tag" ]; then
              echo "release 指令版本为 $requested_tag，但项目版本为 $expected_tag。请更新项目内部版本或修正提交信息。" >&2
              exit 1
            fi
            tag="$requested_tag"
          fi

          runtime_manifest="Arclume/Resources/OnlineGameDependencies/arclume-wine-runtime.json"
          runtime_version=$(plutil -extract version raw "$runtime_manifest")
          test -n "$runtime_version"

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "build=$build"
            echo "runtime_version=$runtime_version"
            echo "release_name=Arclume $version"
          } >> "$GITHUB_OUTPUT"

      - name: 检查发布签名配置
        id: signing
        run: |
          set -euo pipefail
          if [ -n "$MACOS_APP_CERTIFICATE_P12_BASE64" ] \
            && [ -n "$MACOS_APP_CERTIFICATE_PASSWORD" ] \
            && [ -n "$MACOS_DEVELOPER_TEAM_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "identity=${MACOS_SIGNING_IDENTITY:-Developer ID Application}" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "发布签名凭据未配置：本次产物未签名、未公证，但可通过 DMG SHA-256 校验用于应用内更新。"
          fi

      - name: 准备并核对固定组件清单
        run: python3 script/prepare_downloadable_resources.py

      - name: 导入 Developer ID 签名证书
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/arclume-signing.keychain-db"
          certificate="$RUNNER_TEMP/arclume-signing.p12"
          printf '%s' "$MACOS_APP_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_APP_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychain -d user -s "$keychain" login.keychain-db
          security find-identity -v -p codesigning "$keychain"
          echo "ARCLUME_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: 构建签名 Archive
        if: steps.signing.outputs.enabled == 'true'
        env:
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: |
          archive_path="$RUNNER_TEMP/Arclume.xcarchive"
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$archive_path" \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            DEVELOPMENT_TEAM="$MACOS_DEVELOPER_TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            ARCLUME_RESOURCE_BASE_URL="$ARCLUME_RESOURCE_BASE_URL" \
            SWIFT_EMIT_LOC_STRINGS=NO
          codesign --verify --deep --strict --verbose=2 "$archive_path/Products/Applications/Arclume.app"
          codesign --display --verbose=4 "$archive_path/Products/Applications/Arclume.app"

      - name: 构建未签名 Archive
        if: steps.signing.outputs.enabled != 'true'
        run: |
          archive_path="$RUNNER_TEMP/Arclume.xcarchive"
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$archive_path" \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            ARCLUME_RESOURCE_BASE_URL="$ARCLUME_RESOURCE_BASE_URL" \
            SWIFT_EMIT_LOC_STRINGS=NO

      - name: 制作单个发布 DMG
        id: package
        env:
          VERSION: ${{ steps.release.outputs.version }}
          BUILD: ${{ steps.release.outputs.build }}
          SIGNED_RELEASE: ${{ steps.signing.outputs.enabled }}
        run: |
          set -euo pipefail

          archive_path="$RUNNER_TEMP/Arclume.xcarchive"
          package_root="$RUNNER_TEMP/arclume-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          artifact_dir="$package_root/artifacts"
          full_app_path="$archive_path/Products/Applications/Arclume.app"
          test -d "$full_app_path"

          bundle_version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$full_app_path/Contents/Info.plist")
          bundle_build=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$full_app_path/Contents/Info.plist")
          test "$bundle_version" = "$VERSION"
          test "$bundle_build" = "$BUILD"

          resources_path="$full_app_path/Contents/Resources"
          test -d "$resources_path"
          for required_resource in \
            arclume-wine-runtime.json \
            downloadable-resources.json \
            THIRD-PARTY-NOTICES.txt \
            jx3-gpu-profiles.json \
            jx3-normal-config.ini; do
            test -f "$resources_path/$required_resource" || {
              echo "发布 App 缺少保留的资源文件：$required_resource" >&2
              exit 1
            }
          done

          unexpected_payloads=$(find "$full_app_path/Contents" \
            \( \
              -iname '*.tar.xz' -o \
              -iname '*.tar.gz' -o \
              -iname '*.dll' -o \
              -iname '*.so' \
            \) -print)
          unexpected_resource_libraries=$(find "$resources_path" \
            \( \
              \( -iname '*.dylib' \) -o \
              \( -type d \( \
                -iname 'Libs' -o \
                -iname 'd3dMetal3' -o \
                -iname 'd3dMetal4' -o \
                -iname 'D3DMetal.framework' -o \
                -iname 'd9vk' -o \
                -iname 'dxvk' -o \
                -iname 'wine' \
              \) \) \
            \) -print)
          if [ -n "$unexpected_payloads" ] || [ -n "$unexpected_resource_libraries" ]; then
            printf '发布 App 含不应打包的运行资源：\n%s\n%s\n' \
              "$unexpected_payloads" "$unexpected_resource_libraries" >&2
            exit 1
          fi

          # Self-hosted runners can retain RUNNER_TEMP between jobs.  Keep all
          # temporary package paths unique to this workflow attempt so a failed
          # prior attempt never blocks a later release.
          mkdir -p "$artifact_dir"
          dmg_path="$artifact_dir/Arclume-${VERSION}.dmg"
          hdiutil create \
            -volname "Arclume" \
            -srcfolder "$full_app_path" \
            -format UDZO \
            -imagekey zlib-level=9 \
            "$dmg_path"
          hdiutil verify "$dmg_path"

          if [ "$SIGNED_RELEASE" = "true" ]; then
            signing_identity="${MACOS_SIGNING_IDENTITY:-Developer ID Application}"
            codesign --force --sign "$signing_identity" --timestamp "$dmg_path"
            hdiutil verify "$dmg_path"
          fi

          checksum_path="$dmg_path.sha256"
          shasum -a 256 "$dmg_path" > "$checksum_path"

          {
            echo "artifact_dir=$artifact_dir"
            echo "dmg_path=$dmg_path"
            echo "checksum_path=$checksum_path"
            echo "signed_release=$SIGNED_RELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: 保存构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Arclume-${{ steps.release.outputs.tag }}
          path: ${{ steps.package.outputs.artifact_dir }}
          if-no-files-found: error

      - name: 上传并校验对象存储资源
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARCLUME_OSS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARCLUME_OSS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.ARCLUME_OSS_REGION }}
          AWS_ENDPOINT_URL: ${{ secrets.ARCLUME_OSS_ENDPOINT_URL }}
          ARCLUME_RESOURCE_BUCKET: ${{ secrets.ARCLUME_RESOURCE_BUCKET }}
          VERSION: ${{ steps.release.outputs.version }}
          BUILD: ${{ steps.release.outputs.build }}
          DMG_PATH: ${{ steps.package.outputs.dmg_path }}
        run: |
          set -euo pipefail
          if ! command -v aws >/dev/null; then brew install awscli; fi
          python3 script/upload_resources.py \
            --dmg "$DMG_PATH" --app-version "$VERSION" --app-build "$BUILD" --execute

      - name: 发布 GitHub Release
        env:
          TAG: ${{ steps.release.outputs.tag }}
          BUILD: ${{ steps.release.outputs.build }}
          RELEASE_NAME: ${{ steps.release.outputs.release_name }}
          RUNTIME_VERSION: ${{ steps.release.outputs.runtime_version }}
          DMG_PATH: ${{ steps.package.outputs.dmg_path }}
          CHECKSUM_PATH: ${{ steps.package.outputs.checksum_path }}
          SIGNED_RELEASE: ${{ steps.package.outputs.signed_release }}
        run: |
          set -euo pipefail

          checksum=$(awk '{print $1}' "$CHECKSUM_PATH")
          notes=$(printf '%s\n' \
            "由 GitHub Actions 的 macos-26 runner 自动构建。" \
            "" \
            "- 应用：$RELEASE_NAME" \
            "- Arclume Wine：$RUNTIME_VERSION（按资源清单从对象存储下载，不包含在安装包中。）" \
            "- D3DMetal、Wine 和其他运行资源由应用按需从配置的资源源下载；安装包不包含运行组件或资源归档。" \
            "- 要求 macOS 26.0 或更高版本。" \
            "" \
            "源代码与第三方声明：" \
            "- App：https://github.com/PigeonMuyz/Arclume/tree/$TAG" \
            "- Runtime：https://github.com/PigeonMuyz/Arclume-Runtime/tree/arclume-wine-$RUNTIME_VERSION" \
            "- 组件声明：https://github.com/PigeonMuyz/Arclume/blob/$TAG/THIRD-PARTY-NOTICES.md" \
            "- D3DMetal 是 Apple 提供的兼容性组件，不属于 Arclume GPL 源码，也不被 Arclume 声明为开源。" \
            "" \
            "DMG：Arclume-${TAG#v}.dmg" \
            "SHA-256：$checksum" \
            "" \
            "$(if [ "$SIGNED_RELEASE" = "true" ]; then
                printf '%s' 'App 已使用 Developer ID 签名；尚未自动公证。应用内更新以 DMG SHA-256、Bundle ID 和版本/构建号校验后安装。'
              else
                printf '%s' '本次未配置发布签名凭据，DMG 未签名、未公证；应用内更新会在 SHA-256、Bundle ID 和版本/构建号校验后安装。'
              fi)")

          # A reissued version gets an immutable build-specific summary;
          # historical release notes are never overwritten.
          release_summary="CHANGELOG/released/${TAG#v}-${BUILD}.md"
          if [ ! -f "$release_summary" ]; then
            release_summary="CHANGELOG/released/${TAG#v}.md"
          fi
          if [ -f "$release_summary" ]; then
            notes="$(cat "$release_summary")"$'\n\n'"$notes"
          fi

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_NAME" \
              --notes "$notes"
          fi

          gh release upload "$TAG" \
            "$DMG_PATH" \
            "$CHECKSUM_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_NAME" \
            --notes "$notes" \
            --prerelease=false \
            --latest

      - name: 按兼容保留规则清理过期对象
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARCLUME_OSS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARCLUME_OSS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.ARCLUME_OSS_REGION }}
          AWS_ENDPOINT_URL: ${{ secrets.ARCLUME_OSS_ENDPOINT_URL }}
          ARCLUME_RESOURCE_BUCKET: ${{ secrets.ARCLUME_RESOURCE_BUCKET }}
          VERSION: ${{ steps.release.outputs.version }}
          BUILD: ${{ steps.release.outputs.build }}
          DMG_PATH: ${{ steps.package.outputs.dmg_path }}
        run: |
          python3 script/upload_resources.py \
            --dmg "$DMG_PATH" --app-version "$VERSION" --app-build "$BUILD" \
            --execute --apply-retention

      - name: 保存对象存储发布报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Arclume-resource-report-${{ github.run_id }}
          path: build/resource-upload/publish-report.json
          if-no-files-found: ignore
